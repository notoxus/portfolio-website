name: Generate Pacman Matrix

on:
  schedule:
    - cron: "0 3 * * *" # auto sync data daily in 3 o'clock am UTC
  workflow_dispatch: # run manually access in Github

permissions:
  contents: write

jobs:
  generate:
  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Move and Commit Pacman SVG
        run: |
          # Action này thường xuất file ra thư mục dist hoặc root, ta đưa chuẩn về public/snake.svg để Next.js nhận diện
          mkdir -p public
          if [ -f "dist/pacman-contribution-graph.svg" ]; then
            cp dist/pacman-contribution-graph.svg public/snake.svg
          elif [ -f "pacman-contribution-graph.svg" ]; then
            cp pacman-contribution-graph.svg public/snake.svg
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/snake.svg
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "chore(auto): update github contribution pacman animation"
          git push