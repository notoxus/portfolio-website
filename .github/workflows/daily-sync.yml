name: Generate Pacman Matrix

on:
  schedule:
    - cron: "0 3 * * *" # auto sync data daily in 3 o'clock am UTC
  push:
    branches:
      - main
  workflow_dispatch: # run manually access in Github

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Move Pacman SVG
        run: |
          mkdir -p public
          if [ -f "dist/pacman-contribution-graph.svg" ]; then
            cp dist/pacman-contribution-graph.svg public/snake.svg
          elif [ -f "pacman-contribution-graph.svg" ]; then
            cp pacman-contribution-graph.svg public/snake.svg
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate Proof of Work Stats
        run: python3 scripts/fetch_proof_of_work.py
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/snake.svg content/proof-of-work.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "chore(auto): update github contribution pacman and proof-of-work metrics"
          git push