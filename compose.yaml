services:
  dev:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      # Keep Linux dependencies out of the host checkout (and avoid host/CPU mismatches).
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    init: true
    command: pnpm dev --hostname 0.0.0.0

  web:
    profiles: [production]
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    init: true

volumes:
  node_modules:
  next_cache:
