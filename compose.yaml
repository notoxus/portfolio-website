services:
  dev:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      # Keep Linux dependencies out of the host checkout (and avoid host/CPU mismatches).
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    init: true
    # Start again with the Docker daemon after the first `docker compose up -d`.
    restart: unless-stopped
    # The named node_modules volume survives image rebuilds, so sync it with
    # pnpm-lock.yaml before starting the dev server.
    command: sh -c 'pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0'

  web:
    profiles: [production]
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    init: true

volumes:
  node_modules:
  next_cache:
